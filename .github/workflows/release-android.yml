name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Configure Firebase Android app
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Configure stable Android signing
        shell: bash
        env:
          KLECT_KEYSTORE_BASE64: ${{ secrets.KLECT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KLECT_KEYSTORE_BASE64"
          printf '%s' "$KLECT_KEYSTORE_BASE64" | base64 --decode > android/klect-release.jks
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - name: Build signed release APK
        env:
          KLECT_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/klect-release.jks
          KLECT_KEYSTORE_PASSWORD: ${{ secrets.KLECT_KEYSTORE_PASSWORD }}
          KLECT_KEY_ALIAS: ${{ secrets.KLECT_KEY_ALIAS }}
          KLECT_KEY_PASSWORD: ${{ secrets.KLECT_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Prepare stable asset name
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk klect.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: mobile/klect.apk
          generate_release_notes: true
