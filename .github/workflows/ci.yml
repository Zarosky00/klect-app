name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Flutter rasterization differs slightly across host operating systems.
      # The checked-in visual baseline is verified on Windows; CI keeps the
      # platform-neutral behavioral suite deterministic.
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: klect-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dikhuygcwxnrsckqglzg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nwJjxG8yJ01lTjrv6pXQww_mQ9MNq5t
      NEXT_PUBLIC_SITE_URL: https://klect-web.vercel.app
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
