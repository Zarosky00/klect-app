name: klect
description: "KLECT — a social network where the unit of content is a collection."
publish_to: 'none'

# ⚠ The x.y.z part MUST move in lockstep with `kAppVersion` in
# lib/core/app_version.dart AND the GitHub release tag (vX.Y.Z) on
# Zarosky00/klect-app — the in-app update checker compares the two.
version: 1.7.0+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.16.0

  # State + navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Media
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  flutter_blurhash: ^0.9.1
  image_picker: ^1.2.3
  image: ^4.9.1
  photo_view: ^0.15.0

  # Platform / utility
  share_plus: ^13.3.0
  timeago: ^3.7.1
  shimmer: ^3.0.0
  flutter_webrtc: ^1.5.2
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  collection: ^1.19.1

  # Sideloaded Android updates: `http` polls GitHub and streams the APK into
  # KLECT's private cache; `crypto` verifies GitHub's release digest before
  # the native Android package installer is opened.
  http: ^1.6.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2

  # Notifications stage 1: system-tray notifications for realtime arrivals
  # while the app is backgrounded-but-running. Requires core-library
  # desugaring on Android (android/app/build.gradle.kts).
  flutter_local_notifications: ^22.2.0

  # Notifications stage 2: real FCM push when the app is backgrounded/killed.
  # Firebase project `klect-b776a` is registered (android/app/google-services.json,
  # not committed — see .gitignore). Wired to public.register_push_token /
  # unregister_push_token; server fanout is docs/OPERATIONS.md §2.
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Generates the Android adaptive/legacy mipmaps + iOS icon set from the
  # programmatically rendered PNGs in assets/icon/ (see
  # test/tools/render_app_icon_test.dart). Run:
  #   flutter test test/tools/render_app_icon_test.dart
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

# App identity: the "K + shelf" mark, oxblood on noir (values from
# packages/tokens/tokens.json via tokens.g.dart — the renderer imports them).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Brand fonts are BUNDLED variable TTFs (no runtime fetch, no Roboto first
  # paint). Family names must match `typography.family` in
  # packages/tokens/tokens.json. Exact token weights (450/550/650) are reached
  # via FontVariation('wght', …) in lib/design/theme.dart — the variable fonts
  # cover the full axis, so no per-weight assets are needed.
  # Licences: assets/fonts/OFL-*.txt (registered in main.dart).
  fonts:
    - family: Fraunces
      fonts:
        - asset: "assets/fonts/Fraunces[SOFT,WONK,opsz,wght].ttf"
    - family: Instrument Sans
      fonts:
        - asset: "assets/fonts/InstrumentSans[wdth,wght].ttf"

  assets:
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-InstrumentSans.txt
