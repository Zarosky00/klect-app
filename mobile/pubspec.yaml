name: klect
description: "KLECT — a social network where the unit of content is a collection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.16.0

  # State + navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Media
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.9.1
  image_picker: ^1.2.3
  image: ^4.9.1
  photo_view: ^0.15.0

  # Platform / utility
  share_plus: ^13.3.0
  timeago: ^3.7.1
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  flutter_webrtc: ^1.5.2
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
