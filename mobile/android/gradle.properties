# Sized for this machine's 8 GB of physical RAM — the Flutter-template default
# (-Xmx8G -XX:MaxMetaspaceSize=4G) exceeds physical memory and crashes the
# Gradle daemon with a native OOM (see hs_err_pid*.log).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation disabled: its cache files hit Windows file-lock
# errors (could-not-close-incremental-caches) on this machine.
kotlin.incremental=false
